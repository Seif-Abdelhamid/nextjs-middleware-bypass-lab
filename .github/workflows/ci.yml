name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests, lint, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check nextguard tests
      - name: Unit tests
        run: pytest -q -m "not integration"
      - name: Bandit (SAST)
        run: bandit -q -r nextguard
      - name: pip-audit (dependency scan)
        run: pip-audit || true   # report; dev-only deps, do not fail the build

  repro:
    name: Reproduction against real Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Install lab apps
        run: |
          (cd labs/vulnerable-app && npm install --no-audit --no-fund)
          (cd labs/patched-app && npm install --no-audit --no-fund)
      - name: Run reproduction tests (boots both apps)
        run: pytest -q -m integration -rs

  self-scan:
    name: nextguard self-scan (demo, non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Audit lab manifests (expected to flag the vulnerable app)
        run: nextguard deps labs || echo "nextguard correctly flagged vulnerable manifests"
      - name: Scan sample logs (expected to flag attack lines)
        run: nextguard logs detection/samples/*.log --ignore-paired || echo "nextguard correctly flagged attack logs"
