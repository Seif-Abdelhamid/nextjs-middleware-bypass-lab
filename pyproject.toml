[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextguard"
version = "0.1.0"
description = "Detection and remediation helpers for CVE-2025-29927 (Next.js middleware authorization bypass)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Seif Abdelhamid"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
nextguard = "nextguard.cli:main"

[tool.setuptools]
packages = ["nextguard"]

[tool.pytest.ini_options]
markers = ["integration: boots the real Next.js apps (needs node + npm install)"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
